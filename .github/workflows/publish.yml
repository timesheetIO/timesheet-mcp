# This workflow lives inside the package so the subtree mirror carries it to
# the root of the public timesheetIO/timesheet-mcp repo, where it runs.
# It is inert in the monorepo (GitHub only runs workflows under the repo-root
# .github/workflows). Publishing from this repo makes the build source match
# package.json `repository.url`, so npm generates provenance automatically.
name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          package-manager-cache: false
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2; exit 1; }
      - run: npm run build
      # Authenticated via OIDC trusted publishing (no NODE_AUTH_TOKEN). Because
      # this repo matches package.json `repository.url`, npm attaches a
      # provenance attestation automatically (no --provenance flag needed).
      - name: Publish to NPM
        run: npm publish --access public

  # The MCP Registry entry (io.github.timesheetIO/timesheet-mcp) follows each release. The registry
  # checks that the npm package with this mcpName exists at the version, so this runs after npm.
  # Signing in with GitHub OIDC works because this runs in the timesheetIO organization.
  publish-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Verify server.json matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for VERSION in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            [ "$VERSION" = "$TAG_VERSION" ] || { echo "server.json says $VERSION, the tag is v$TAG_VERSION" >&2; exit 1; }
          done
      # npm processes a publish asynchronously ("may take a few minutes to become available"),
      # and the registry refuses a version npm does not serve yet: wait until it does
      - name: Wait for the version on npm
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for attempt in $(seq 1 40); do
            [ "$(npm view "@timesheet/mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "@timesheet/mcp@$VERSION is still not on npm after 10 minutes" >&2
          exit 1
      - name: Install mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$BASE/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$BASE/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          sha256sum -c --ignore-missing "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Sign in to the MCP Registry
        run: $RUNNER_TEMP/mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: $RUNNER_TEMP/mcp-publisher publish
